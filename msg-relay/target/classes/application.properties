spring.application.name=messenger-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/database}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:localhost:5500}
app.avatar-dir=${APP_AVATAR_DIR:/app/uploads/avatars}