<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

</head>
<body style="background: url(assets/img/blue_waves-bg_fhd.png);">
    <div id="bg-container" style="max-width:1344px;height:auto;text-align:center;position:absolute;">

        <div id="chat-layout">


            <div id="user-container" style="background-color: #0984e3; width:95%; text-align:center">

                <img src="assets/img/pfp-placeholder.png" ald="pfp"  style="max-width:150px;max-height:150px;">
                <div style="color: white;">Username <input type="text" id="uname-i" /></div>
                <div style="color: white;">Password <input type="text" id="upass-i" /></div>
                <button id="load-messages">Login!</button>

                <div style="color: white;">Status <span id="ustatus">[Authorized/Not]</span></div>
                <button id="load-messages">Load!</button>

            </div>

            <div id="dialogue-container" style="background-color: #0984e3; width:95%; text-align:center">

                <div id="message-container"></div>
                <div id="message-input">
                    <input type="text" id="xtext-i" /><button id="test-button">Send!</button>
                </div>

            </div>

        </div>

    </div>

    <script src="js/message_board.js"></script>
    <script src="js/send_message.js"></script>
    <script src="js/get_all_messages.js"></script>

</body>

</html>
