<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

</head>
<body style="background: url(assets/img/blue_waves-bg_fhd.png);">
    <div id="bg-container" style="max-width:1344px;height:auto;text-align:center;position:absolute; display:flex;">

        <div id="chat-layout">

            <section id="user-window" style="background-color: #3b3b3bb2; width:95%;" class="app-window active-tab" data-msg-tab-content>

            <div id="user-container-header" class="app-window-header">Authorization</div>
            <div id="user-container" style="text-align:center;" ></div>

            </section>

            <section id="dialogue-window" class="app-window" style="background-color: #3b3b3bb2; width:95%;" data-msg-tab-content>

            <div id="dialogue-container-header" class="app-window-header">Chat</div>
            <div id="dialogue-container" style="text-align:center;" >

                <div id="message-container"></div>
                <div id="message-input">
                    <input type="text" id="runame-i"/><input type="text" id="xtext-i" /><button id="test-button">Send!</button>
                </div>

            </div>

            </section>

        </div>

        <ul class="msg-tabs">
            <li data-msg-tab-target="#user-window" style="padding: 0.5em; border: 0.5em solid rgb(219, 219, 219); background-color:#3b3b3bb2;">User</li>
            <li data-msg-tab-target="#dialogue-window" style="padding: 0.5em; border: 0.5em solid rgb(219, 219, 219); background-color:#3b3b3bb2;">Chat</li>
            <li data-msg-tab-target="#music-window" style="padding: 0.5em; border: 0.5em solid rgb(219, 219, 219); background-color:#3b3b3bb2;">Chat</li>
            <li data-msg-tab-target="#diagn-window" style="padding: 0.5em; border: 0.5em solid rgb(219, 219, 219); background-color:#3b3b3bb2;">Chat</li>
        </ul>

        <img id="maiden-img" src="assets/img/maiden.png">

        <div id="music-window" style="display: none; width: 18vw; height: 18vh; background-color: #3b3b3bb2" class="app-window" data-msg-tab-content>
            <div id="music-window-header" class="app-window-header">Music player</div>
            <div id="music-container"></div>
        </div>

        <div id="diagn-window" style="display: none; width: 18vw; height: 18vh; background-color: #3b3b3bb2" class="app-window" data-msg-tab-content>
            <div id="diagn-window-header" class="app-window-header">Diagnostics</div>
            <div id="diagn-container"><button id="user-auth-btn">Change auth flag</button></div>
        </div>

    </div>


    
    <script src="js/auth_api.js"></script>
    <script src="js/send_message.js"></script>
    <script src="js/get_all_user_messages.js"></script>
    <script src="js/auth_board.js"></script>
    <script src="js/message_board.js"></script>
    <script src="js/tabs_board.js"></script>

</body>

</html>
